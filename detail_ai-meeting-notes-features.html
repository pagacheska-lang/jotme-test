  <script>
  (function () {
    // Check if the URL contains #download
    if (window.location.hash === '#download') {
      var storageKey = 'jotme_download_modal_seen';
      // Show only once per session (use localStorage for once-ever)
      if (!sessionStorage.getItem(storageKey)) {
        var modal = document.getElementById('download');
        if (modal) {
          modal.style.display = 'flex'; // or 'block' depending on your layout
          sessionStorage.setItem(storageKey, 'true');
        }
      }
    }
    // Close modal when clicking outside or a close button
    document.addEventListener('click', function (e) {
      var modal = document.getElementById('download');
      if (!modal) return;
      // Close if clicking the backdrop (the modal itself, not its children)
      if (e.target === modal) {
        modal.style.display = 'none';
      }
      // Close if clicking an element with class "close-modal"
      if (e.target.classList.contains('close-modal')) {
        modal.style.display = 'none';
      }
    });
  })();
</script>
  <script>
      const baseUrl = "https://app.jotme.io/api/analytics";
      // const baseUrl = "http://localhost:3001/api/analytics";
      function generateUUID() {
        return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(
          /[xy]/g,
          function (c) {
            const r = (Math.random() * 16) | 0;
            const v = c === "x" ? r : (r & 0x3) | 0x8;
            return v.toString(16);
          }
        );
      }
      (function () {
        // Get or Create Visitor ID
        let visitorId = localStorage.getItem("visitorId");
        const urlParams = new URLSearchParams(window.location.search);
        const source =
          urlParams.get("utm_source") || document.referrer || "direct";
        const landingPage = window.location.href;
        if (!visitorId) {
          visitorId = generateUUID();
          localStorage.setItem("visitorId", visitorId);
        }
        // Save visitor information in a cookie
        const visitorInfo = {
          visitorId,
          source,
          landingPage,
        };
        // Track visitor source once
        const isSourceTracked = localStorage.getItem("visitorSourceTracked");
        if (!isSourceTracked) {
          // document.cookie = `visitorId=${visitorId}; path=/; max-age=${
          //   60 * 60 * 24 * 365
          // }; SameSite=Lax; domain=localhost`;
          document.cookie = `visitorId=${visitorId}; path=/; max-age=${60 * 60 * 24 * 365}; SameSite=None; Secure; domain=.jotme.io`;
          fetch(baseUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              visitorId,
              source,
              landingPage,
              event: "visit",
              timestamp: new Date().toISOString(),
            }),
          })
            .then((res) => {
              if (res.ok) {
                localStorage.setItem("visitorSourceTracked", "true");
                console.log("Source tracked:", {
                  visitorId,
                  source,
                  landingPage,
                });
              }
            })
            .catch((err) => console.error("Source tracking failed:", err));
        }
        // Track Download Clicks for Specific Buttons
        function trackDownload(event, downloadType) {
          const timestamp = new Date().toISOString();
          fetch(baseUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              visitorId,
              source,
              landingPage,
              event: downloadType,
              timestamp,
              destinationPage: window.location.href
            }),
          })
            .then((res) => {
              if (res.ok) {
                console.log(`Download tracked: ${downloadType}`);
              }
            })
            .catch((err) => console.error("Download tracking failed:", err));
        }
        // Attach event handlers to each download button
        document
          .getElementById("download-mac")
          .addEventListener("click", function (e) {
            trackDownload(e, "download-mac");
          });
        document
          .getElementById("download-windows")
          .addEventListener("click", function (e) {
            trackDownload(e, "download-windows");
          });
        document
          .getElementById("add-to-chrome")
          .addEventListener("click", function (e) {
            trackDownload(e, "add-to-chrome");
          });
        document
          .getElementById("download-intel-mac")
          .addEventListener("click", function (e) {
            trackDownload(e, "download-intel-mac");
          });
      })();
    </script>
